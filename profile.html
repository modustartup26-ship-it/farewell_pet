<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 아이 등록 · farewell pet</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="ai-chat.css">
</head>
<body class="wizard">
<main class="shell" id="wizard-shell" hidden>
  <header class="wz-head">
    <button class="icon-btn" id="back" type="button" aria-label="이전 질문"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
    <div class="progress" aria-hidden="true"><div class="progress-track"><div class="progress-fill" id="progress-fill"></div><span class="progress-paw" id="progress-paw"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg></span></div></div>
    <span class="count tnum" id="count"></span>
  </header>
  <form id="wizard" class="wz-body" novalidate autocomplete="off">
    <div class="ask">
      <div class="asker" id="asker" aria-hidden="true"></div>
      <div class="ask-text">
        <span class="optional" id="optional" hidden>선택</span>
        <h1 id="question" tabindex="-1"></h1>
        <p id="hint"></p>
      </div>
    </div>
    <div class="answer" id="answer"></div>
    <p class="error" id="error" role="alert"></p>
  </form>
  <footer class="wz-foot">
    <button class="btn-ghost" id="skip" type="button">나중에 입력할게요</button>
    <button class="btn btn-primary" id="next" type="submit" form="wizard">다음</button>
  </footer>
</main>
<main class="shell" id="profile-gate" aria-live="polite">
  <section class="profile-auth">
    <h1>로그인하고 아이를 등록해 주세요</h1>
    <p>아이 정보는 로그인한 계정에 안전하게 저장돼요. 이메일로 로그인 링크를 보내 드릴게요.</p>
    <button class="btn btn-primary guest-profile" id="guest-profile" type="button">로그인 없이 임시 등록하고 둘러보기</button>
    <p class="guest-profile-note">임시 아이 정보는 이 브라우저에만 저장돼요. 계정 동기화와 수의사 상담에는 로그인이 필요해요.</p>
    <form id="profile-login" class="profile-login">
      <label class="field"><span class="sr-only">이메일</span><input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="이메일 주소"></label>
      <button class="btn btn-primary" type="submit">로그인 링크 받기</button>
      <p class="error" id="profile-auth-error" role="alert" hidden></p>
    </form>
    <a class="btn-ghost" href="index.html">처음으로</a>
  </section>
</main>
<script src="common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="minimi.js"></script>
<script src="concerns.js"></script>
<script src="mcpq.js"></script>
<script src="profile.js"></script>
<script src="ai-chat.js"></script>
</body>
</html>
