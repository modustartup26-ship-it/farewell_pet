<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>산책 지도 · farewell pet</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ai-chat.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="daily.css">
</head>
<body class="app">
<header class="topbar app-top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg></span>farewell pet</a>
  <nav class="tabbar" aria-label="주 메뉴">
    <button type="button" data-view="map" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg><span>산책 지도</span></button>
    <button type="button" data-view="saved"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg><span>찜한 곳</span><b class="badge tnum" id="saved-count">0</b></button>
    <button type="button" data-view="diary"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg><span>산책 일기</span></button>
    <a href="shop.html"><svg class="i" aria-hidden="true"><use href="#i-bone"/></svg><span>포인트샵</span></a>
    <a href="family.html"><svg class="i" aria-hidden="true"><use href="#i-family"/></svg><span>가족</span></a>
    <a href="topics.html"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg><span>건강토픽</span></a>
    <a href="inbox.html"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span>문의함</span></a>
  </nav>
  <div class="me-menu-wrap">
    <button class="me" type="button" id="me" aria-label="아이 메뉴 열기" aria-expanded="false" aria-controls="profile-menu"></button>
    <div class="profile-menu" id="profile-menu" hidden>
      <a href="profile.html"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg><span>아이 정보 수정</span></a>
      <button type="button" id="logout"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg><span>로그아웃</span></button>
    </div>
  </div>
</header>

<main>
  <section class="view view-map" id="view-map">
    <div class="map-head">
      <div>
        <h1 id="map-title">산책 지도</h1>
        <p id="map-hint">가고 싶은 곳을 누르면 산책로를 따라 걸어가요.</p>
      </div>
      <div class="pet-strip" id="pet-strip"></div>
    </div>
    <div class="map" id="map"></div>
  </section>

  <section class="view view-list" id="view-saved" hidden>
    <h1>찜한 곳</h1>
    <p class="lead">마음에 담아 둔 곳을 모아 봤어요.</p>
    <div class="list" id="saved-list"></div>
  </section>

  <section class="view view-list view-diary" id="view-diary" hidden>
    <div class="list-head daily-head"><div><h1 id="diary-title">오늘 하루</h1><p class="lead">밥·산책·배변을 버튼 한 번으로 남겨요. 쌓인 기록은 병원과 시설에 보여 줄 수 있어요.</p></div><div class="head-actions"><button type="button" class="btn btn-soft" id="diary-facility"><svg class="i" aria-hidden="true"><use href="#i-building-h"/></svg>시설 기록</button><a class="btn btn-soft" href="album.html"><svg class="i" aria-hidden="true"><use href="#i-camera"/></svg>앨범</a></div></div>
    <div id="daily"></div>
    <input type="file" accept="image/*" capture="environment" id="moment-file" hidden>
    <input type="file" accept="image/*" id="album-file" hidden>
  </section>
</main>

<!-- 시설 기록: 병원·호텔·유치원·미용 다녀온 날 -->
<dialog class="sheet full facility-sheet" id="facility" aria-labelledby="facility-title">
  <div class="sheet-head"><button type="button" class="icon-btn" data-close aria-label="하루 기록으로 돌아가기"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><h2 id="facility-title">시설 기록</h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div class="sheet-body facility-body">
    <div class="list-head"><div><h3 class="fac-sub">다녀온 곳·다녀올 곳</h3><p class="lead">병원·호텔·유치원·미용실에서의 하루를 남기면 다음에 시설을 고를 때 함께 보여 드려요.</p></div><div class="head-actions"><a class="btn btn-soft" href="care.html"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg>체크리스트</a><button type="button" class="btn btn-primary" id="diary-new"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg>시설 기록 쓰기</button></div></div>
    <div class="cal" id="cal"></div>
    <div id="diary-trend"></div>
    <div class="diary-sum" id="diary-sum"></div>
    <div class="list diary-list" id="diary-list"></div>
    <aside class="cal-sync" id="cal-sync"></aside>
  </div>
</dialog>

<!-- 실시간 산책 -->
<dialog class="walk-live" id="walk-live" aria-label="산책 중"></dialog>

<!-- 그 순간 사진: 앱 안 카메라 -->
<dialog class="camera" id="camera" aria-label="사진 찍기"></dialog>

<!-- 필터링 -->
<dialog class="sheet" id="filter" aria-labelledby="filter-title">
  <div class="grip" aria-hidden="true"></div>
  <div class="sheet-head"><span></span><h2 id="filter-title">필터링</h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form class="sheet-body" id="filter-form"></form>
  <div class="sheet-foot"><button type="button" class="btn-ghost" id="filter-reset"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>초기화</button><button type="submit" form="filter-form" class="btn btn-primary" id="filter-apply">적용하기</button></div>
</dialog>

<!-- 결과 -->
<dialog class="sheet full" id="results" aria-labelledby="results-title">
  <div class="sheet-head"><button type="button" class="icon-btn" id="results-back" aria-label="필터로 돌아가기"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><h2 id="results-title"></h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div class="applied" id="applied"></div>
  <div class="sheet-body" id="results-body"></div>
</dialog>

<!-- 상세 -->
<dialog class="sheet full" id="detail" aria-labelledby="detail-title">
  <div class="sheet-head"><button type="button" class="icon-btn" data-close aria-label="목록으로 돌아가기"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><span></span><button type="button" class="icon-btn heart-btn" id="detail-heart" aria-pressed="false" aria-label="찜하기"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg></button></div>
  <div class="sheet-body detail-body" id="detail-body"></div>
  <div class="sheet-foot detail-foot"><a class="btn btn-soft" id="call"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>전화문의</a><button type="button" class="btn btn-primary" id="ask"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>간편 돌봄문의</button></div>
</dialog>

<!-- 준비 중 / 기록 / 문의 -->
<dialog class="sheet" id="modal" aria-labelledby="modal-title">
  <div class="grip" aria-hidden="true"></div>
  <div class="sheet-head"><span></span><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form class="sheet-body" id="modal-form"></form>
  <div class="sheet-foot" id="modal-foot"></div>
</dialog>

<script src="common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="kakaomap.js"></script>
<script src="media.js"></script>
<script src="auth-ui.js"></script>
<script src="minimi.js"></script>
<script src="concerns.js"></script>
<script src="trailmap.js"></script>
<script src="hospitals.js"></script>
<script src="public-places.js"></script>
<script src="places.js"></script>
<script src="reports.js"></script>
<script src="diary.js"></script>
<script src="daily.js"></script>
<script src="app.js"></script>
<script src="points.js"></script>
<script src="ai-chat.js"></script>
</body>
</html>
